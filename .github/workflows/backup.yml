name: Database backup

on:
  schedule:
    # Daily at 03:00 UTC. Cron is UTC-only on GitHub Actions.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Preflight: prove which token GitHub is actually using and that it can
      # reach R2 at all, before spending time on the dumps. If this step's
      # whoami shows a different token scope than expected, the
      # CLOUDFLARE_API_TOKEN secret is stale/wrong — fix the secret, not the
      # token. The bucket-head confirms R2 write scope independently of whoami.
      - name: Preflight — verify Cloudflare token and R2 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "=== Account ID in use (first 6 chars): ${CLOUDFLARE_ACCOUNT_ID:0:6}… ==="
          echo "=== Bucket name in use: '${R2_BUCKET_NAME}' ==="
          echo "=== wrangler whoami ==="
          npx wrangler whoami
          echo "=== r2 bucket info (proves R2 read/write scope on this bucket) ==="
          npx wrangler r2 bucket info "${R2_BUCKET_NAME}"

      - name: Dump database and upload to R2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/backup-database.mjs
